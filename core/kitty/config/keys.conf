# vim: foldmethod=marker

# Tabs {{{1
map kitty_mod+, previous_tab
map kitty_mod+. next_tab
map kitty_mod+/>, move_tab_backward
map kitty_mod+/>. move_tab_forward
map kitty_mod+/>c launch --type=tab --cwd=current --location=after
map kitty_mod+/>q close_tab
map kitty_mod+/>x close_window_with_confirmation
map kitty_mod+/>kitty_mod+/ goto_tab -1
map kitty_mod+/>1 goto_tab 1
map kitty_mod+/>2 goto_tab 2
map kitty_mod+/>3 goto_tab 3
map kitty_mod+/>4 goto_tab 4
map kitty_mod+/>5 goto_tab 5

# gx {{{1
map kitty_mod+/>g launch --type=tab --cwd=current --location=after --title 'gx' --copy-env fish -c 'gx status'
map kitty_mod+/>kitty_mod+g launch --type=tab --cwd=current --location=after --title 'gx' --copy-env fish -c 'gx status'

# Font size {{{1
map kitty_mod+/>9 change_font_size all +2.0
map kitty_mod+/>8 change_font_size all -2.0
map kitty_mod+/>0 change_font_size all 0
map kitty_mod+= change_font_size all +2.0
map kitty_mod+- change_font_size all -2.0

# Scroll {{{1
map kitty_mod+shift+, scroll_page_up
map kitty_mod+shift+. scroll_page_down
map kitty_mod+shift+j scroll_line_down
map kitty_mod+shift+k scroll_line_up

map kitty_mod+shift+h scroll_page_up
map kitty_mod+shift+l scroll_page_down
map kitty_mod+shift+m scroll_end

# Splits {{{1
map kitty_mod+/>s launch --location=hsplit --cwd=current
map kitty_mod+/>v launch --location=vsplit --cwd=current
map kitty_mod+/>w>w layout_action rotate
map kitty_mod+/>w>r start_resizing_window
map kitty_mod+/>w>s swap_with_window
map kitty_mod+/>! detach_window new-tab-right
map kitty_mod+/>w>d detach_window new-tab-right
map kitty_mod+/>w>m detach_window ask
map kitty_mod+/>t>d detach_tab ask
map kitty_mod+/>y>u kitten hints --type url --program @
map kitty_mod+/>y>p kitten hints --type path --program @
map kitty_mod+/>y>h kitten hints --type hash --program @
# map kitty_mod+/>h neighboring_window left
# map kitty_mod+/>j neighboring_window down
# map kitty_mod+/>k neighboring_window up
# map kitty_mod+/>l neighboring_window right
map kitty_mod+/>m>h move_window left
map kitty_mod+/>m>j move_window down
map kitty_mod+/>m>k move_window up
map kitty_mod+/>m>l move_window right
map kitty_mod+/>e resize_window reset

# Scrollback {{{1

map kitty_mod+/>h show_scrollback
map ctrl+/>h show_scrollback
map kitty_mod+/>l show_last_command_output
map ctrl+/>l show_last_command_output

# URLs {{{1

map kitty_mod+/>u open_url_with_hints
# map kitty_mod+/>o launch --stdin-source=@screen_scrollback $HOME/.dotfiles/core/scripts/dotf-wezterm-run dotf-wezterm-links open "-"
# map kitty_mod+/>y launch --stdin-source=@screen_scrollback $HOME/.dotfiles/core/scripts/dotf-wezterm-run dotf-wezterm-links copy "-"
# map kitty_mod+/>o launch --stdin-source=@screen_scrollback $HOME/.dotfiles/core/scripts/dotf-wezterm-links open "-"
# map kitty_mod+/>o launch --stdin-source=@screen_scrollback $HOME/.dotfiles/core/scripts/dotf-nvim-pager
# map kitty_mod+/>o launch --stdin-source=@screen_scrollback --stdin-add-formatting --type=overlay $HOME/.dotfiles/core/scripts/dotf-nvim-pager


## Misc {{{1

map ctrl+shift+c copy_to_clipboard
map kitty_mod+c copy_or_interrupt
map ctrl+shift+v paste_from_clipboard
map kitty_mod+v paste_from_clipboard

map kitty_mod+/>r load_config_file

map § send_key `

# Sessions {{{1

map kitty_mod+/>o launch --copy-env --type=overlay --cwd=current fish -c "blf kitty targets"
map kitty_mod+/>kitty_mod+o launch --copy-env --type=overlay --cwd=current fish -c "blf kitty targets"

map kitty_mod+/>i launch --copy-env --type=tab --location=after --cwd=current fish -c "blf kitty goto-agent"
map kitty_mod+/>kitty_mod+i launch --copy-env --type=tab --location=after --cwd=current fish -c "blf kitty goto-agent"

map kitty_mod+/>j launch --type=tab --location=after --copy-env --cwd=current fish -c "blf kitty sessions"
map kitty_mod+/>kitty_mod+j launch --type=tab --location=after  --copy-env --cwd=current fish -c "blf kitty sessions"

map kitty_mod+/>kitty_mod+n launch --location=hsplit --bias=10 --copy-env --cwd=current fish -c "blf kitty new-session"

# go to last active session
map kitty_mod+/>m goto_session -1
map kitty_mod+/>n goto_session ~/.local/share/kitty/sessions/notes.kitty-session
